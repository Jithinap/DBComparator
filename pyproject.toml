[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbcomparator"
version = "1.0.0"
description = "Cross-database configuration and metadata comparison utilities"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9,<3"]
mysql = ["mysql-connector-python>=8.3,<10"]
oracle = ["oracledb>=2.0,<4"]
dev = ["pytest>=8.0,<9"]
all = [
  "psycopg2-binary>=2.9,<3",
  "mysql-connector-python>=8.3,<10",
  "oracledb>=2.0,<4",
  "pytest>=8.0,<9",
]

[project.scripts]
dbcompare-postgres = "dbcomparator.postgres:main"
dbcompare-mysql = "dbcomparator.mysql_check:main"
dbcompare-oracle = "dbcomparator.oracle:main"

[tool.setuptools.packages.find]
include = ["dbcomparator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
